<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violeta Bank – Simulador</title>
<style>
:root{
  --bg:#f2f0f5;--surface:#fff;--ink:#1d1527;--muted:#6f6679;--brand:#7a1fd1;--brand-ink:#fff;--line:#e4dfea;--chip:#efe6fa;--ok:#1a8f4c;--bad:#c0332b;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120c1a;--surface:#1e1529;--ink:#f3eefa;--muted:#a79bb7;--line:#33264a;--chip:#2b1d40;--ok:#4cd68b;--bad:#ff7a70}}
:root[data-theme="dark"]{--bg:#120c1a;--surface:#1e1529;--ink:#f3eefa;--muted:#a79bb7;--line:#33264a;--chip:#2b1d40;--ok:#4cd68b;--bad:#ff7a70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;padding-bottom:40px}
header{background:var(--brand);color:var(--brand-ink);padding:22px 20px 18px}
.top{display:flex;justify-content:space-between;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700}
.hello{margin:18px 0 0;font-size:1.15rem;font-weight:600}
.tools{display:flex;gap:8px}
.tools button{background:none;color:#fff;border:0;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;padding:0}
.sim{display:inline-block;margin-top:10px;font-size:.75rem;background:rgba(0,0,0,.22);padding:4px 10px;border-radius:99px}
section{background:var(--surface);margin:0;padding:20px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center}
h2{font-size:.95rem;margin:0;font-weight:600}
.bal{font-size:2rem;font-weight:700;margin:8px 0 0;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:.85rem}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;font-size:.85rem;padding:4px 0}
@media (prefers-color-scheme:dark){.link{color:#c79bf5}}
.eye{background:none;border:0;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:none;padding:18px 14px 18px;margin:0;border-bottom:0}
.act{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--ink);font:inherit;font-size:.74rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:8px}
.act span{width:56px;height:56px;border-radius:50%;background:var(--bg);color:var(--ink);border:0;display:grid;place-items:center;font-size:1.4rem;transition:transform .12s}
.act:active span{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.act span{transition:none}}
.act:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b78af0;outline-offset:2px}
.card{background:linear-gradient(135deg,#7a1fd1,#4b0f8a);color:#fff;border-radius:14px;padding:16px;margin-top:12px}
.card .num{letter-spacing:2px;margin-top:22px;font-size:.95rem}
.bar{height:8px;background:var(--chip);border-radius:9px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li b{display:block;font-weight:600;font-size:.95rem}
.in{color:var(--ok)}.out{color:var(--ink)}
.empty{padding:14px 0;color:var(--muted);font-size:.9rem}
dialog{border:0;border-radius:20px;padding:22px;width:min(92vw,400px);background:var(--surface);color:var(--ink)}
.pills{background:none;padding:0 20px 20px;margin:0;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.pill{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:0;border-radius:14px;padding:16px;font:inherit;font-size:.9rem;cursor:pointer}
#emp b{color:var(--brand)}
@media (prefers-color-scheme:dark){#emp b{color:#c79bf5}}
.bal{cursor:pointer;display:inline-block}

<script>
var KEY="violeta-bank-v1";
var EYE='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
var EYE_ON=EYE+'</svg>',EYE_OFF=EYE+'<path d="M4 4l16 16"/></svg>';
var S={nome:"Cliente",saldo:1250.75,fatura:380.2,limite:3000,caixinhas:[{n:"Viagem",v:500}],hist:[],hide:false,emp:20000};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function brl(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function money(n){return S.hide?"R$ •••••":brl(n)}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},2200)}
function log(t,v,tipo){S.hist.unshift({t:t,v:v,tipo:tipo,d:new Date().toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})});S.hist=S.hist.slice(0,40)}
function render(){
  $("hello").textContent="Olá, "+S.nome;$("ini").textContent=S.nome.charAt(0).toUpperCase();
  $("bal").textContent=money(S.saldo);
  $("fat").textContent="Fatura "+money(S.fatura);
  var pct=S.limite>0?Math.min(100,S.fatura/S.limite*100):0;$("lim").style.width=pct+"%";
  $("limTxt").textContent=S.hide?"Limite disponível •••":"Limite disponível "+brl(Math.max(0,S.limite-S.fatura))+" de "+brl(S.limite);
  $("eye").innerHTML=S.hide?EYE_OFF:EYE_ON;$("eye").setAttribute("aria-label",S.hide?"Mostrar valores":"Ocultar valores");
  $("emp").innerHTML="<span>Você tem "+(S.hide?"R$ •••••":brl(S.emp))+" disponíveis para <b>empréstimo</b> (simulado).</span>";
  var b=$("boxes");b.innerHTML="";
  if(!S.caixinhas.length){b.innerHTML='<div class="empty">Crie uma caixinha para separar dinheiro.</div>'}
  S.caixinhas.forEach(function(c,i){var li=document.createElement("li");li.innerHTML="<div><b></b><span class='muted'>Guardado</span></div><div></div>";li.querySelector("b").textContent=c.n;li.lastChild.textContent=money(c.v);b.appendChild(li)});
  var h=$("hist");h.innerHTML="";
  if(!S.hist.length){h.innerHTML='<div class="empty">Nenhuma movimentação ainda. Faça um Pix ou depósito.</div>'}
  S.hist.forEach(function(x){var li=document.createElement("li");li.innerHTML="<div><b></b><span class='muted'></span></div><div></div>";li.querySelector("b").textContent=x.t;li.querySelector("span").textContent=x.d;var v=li.lastChild;v.className=x.tipo;v.textContent=(x.tipo==="in"?"+ ":"− ")+money(x.v);h.appendChild(li)});
}
function parse(v){var n=parseFloat(String(v).replace(/\./g,"").replace(",","."));return isNaN(n)?null:Math.round(n*100)/100}
var cb=null;
function ask(title,fields,ok){
  $("dt").textContent=title;$("derr").textContent="";
  var h="";fields.forEach(function(f,i){h+='<label for="f'+i+'">'+f.l+'</label><input id="f'+i+'" inputmode="'+(f.t||"decimal")+'" autocomplete="off" value="'+(f.v==null?"":f.v)+'" placeholder="'+(f.p||"")+'">'});
  $("dbody").innerHTML=h;cb=function(){var vals=fields.map(function(f,i){return $("f"+i).value.trim()});return ok(vals)};
  $("dlg").showModal();var first=$("f0");if(first)first.focus();
}
$("f").addEventListener("submit",function(e){e.preventDefault();var r=cb&&cb();if(r){$("derr").textContent=r}else{$("dlg").close();save();render()}});
$("dcancel").onclick=function(){$("dlg").close()};
function money2(s){return String(s).replace(".",",")}

$("bal").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("bal").click()}};
$("bal").onclick=function(){ask("Editar saldo da conta",[{l:"Novo saldo (R$)",v:money2(S.saldo.toFixed(2)),p:"0,00"}],function(v){var n=parse(v[0]);if(n===null||n<0)return"Digite um valor válido, como 1500,00.";var d=n-S.saldo;S.saldo=n;if(d!==0)log("Ajuste de saldo",Math.abs(d),d>0?"in":"out");toast("Saldo atualizado")})};
$("editFat").onclick=function(){ask("Editar fatura",[{l:"Valor da fatura (R$)",v:money2(S.fatura.toFixed(2))}],function(v){var n=parse(v[0]);if(n===null||n<0)return"Digite um valor válido.";S.fatura=n})};
$("editLim").onclick=function(){ask("Editar limite",[{l:"Limite total (R$)",v:money2(S.limite.toFixed(2))}],function(v){var n=parse(v[0]);if(n===null||n<0)return"Digite um valor válido.";S.limite=n})};
$("hello").onclick=function(){ask("Seu nome",[{l:"Nome",v:S.nome,t:"text"}],function(v){if(!v[0])return"Digite um nome.";S.nome=v[0].slice(0,20)})};
$("newBox").onclick=function(){ask("Nova caixinha",[{l:"Nome",t:"text",p:"Ex.: Reserva"},{l:"Valor inicial (R$)",p:"0,00"}],function(v){var n=parse(v[1]||"0");if(!v[0])return"Dê um nome à caixinha.";if(n===null||n<0)return"Valor inválido.";if(n>S.saldo)return"Saldo insuficiente na conta.";S.saldo-=n;S.caixinhas.push({n:v[0].slice(0,24),v:n});if(n)log("Guardado em "+v[0],n,"out")})};
$("clear").onclick=function(){S.hist=[];save();render()};
$("eye").onclick=function(){S.hide=!S.hide;save();render()};
$("help").onclick=function(){ask("Ajuda",[],function(){});$("dbody").innerHTML="<p class='muted'>Toque no saldo para editá-lo. Use os botões redondos para Pix, pagar, depositar, pedir empréstimo e transferir. Toque no olho para ocultar os valores. Tudo aqui é fictício.</p>"};
$("mail").onclick=function(){ask("Convidar um amigo",[{l:"E-mail do amigo",t:"email",p:"nome@email.com"}],function(v){if(!/^\S+@\S+\.\S+$/.test(v[0]))return"Digite um e-mail válido.";toast("Convite enviado (simulado)")})};

document.querySelectorAll(".act").forEach(function(b){b.onclick=function(){
  var a=b.dataset.a;
  if(a==="pix")ask("Enviar Pix",[{l:"Para quem",t:"text",p:"Nome ou chave"},{l:"Valor (R$)",p:"0,00"}],function(v){var n=parse(v[1]);if(!v[0])return"Informe o destinatário.";if(n===null||n<=0)return"Digite um valor maior que zero.";if(n>S.saldo)return"Saldo insuficiente.";S.saldo-=n;log("Pix para "+v[0],n,"out");toast("Pix enviado")});
  if(a==="boleto")ask("Pagar boleto",[{l:"Descrição",t:"text",p:"Ex.: Conta de luz"},{l:"Valor (R$)",p:"0,00"}],function(v){var n=parse(v[1]);if(!v[0])return"Informe a descrição.";if(n===null||n<=0)return"Digite um valor maior que zero.";if(n>S.saldo)return"Saldo insuficiente.";S.saldo-=n;log("Boleto: "+v[0],n,"out");toast("Boleto pago")});
  if(a==="emp")ask("Pedir empréstimo",[{l:"Valor (R$)",p:"0,00"}],function(v){var n=parse(v[0]);if(n===null||n<=0)return"Digite um valor maior que zero.";if(n>S.emp)return"Valor acima do disponível para empréstimo.";S.emp-=n;S.saldo+=n;log("Empréstimo",n,"in");toast("Empréstimo creditado")});
  if(a==="transf")ask("Transferir",[{l:"Para quem",t:"text",p:"Nome ou conta"},{l:"Valor (R$)",p:"0,00"}],function(v){var n=parse(v[1]);if(!v[0])return"Informe o destinatário.";if(n===null||n<=0)return"Digite um valor maior que zero.";if(n>S.saldo)return"Saldo insuficiente.";S.saldo-=n;log("Transferência para "+v[0],n,"out");toast("Transferência feita")});
  if(a==="dep")ask("Depositar",[{l:"Valor (R$)",p:"0,00"}],function(v){var n=parse(v[0]);if(n===null||n<=0)return"Digite um valor maior que zero.";S.saldo+=n;log("Depósito",n,"in");toast("Depósito feito")});
  if(a==="saq")ask("Sacar",[{l:"Valor (R$)",p:"0,00"}],function(v){var n=parse(v[0]);if(n===null||n<=0)return"Digite um valor maior que zero.";if(n>S.saldo)return"Saldo insuficiente.";S.saldo-=n;log("Saque",n,"out");toast("Saque realizado")});
}});
$("cards").onclick=function(){toast("Cartão físico e virtual (simulado)")};
$("emp").onclick=function(){ask("Editar limite de empréstimo",[{l:"Valor disponível (R$)",v:money2(S.emp.toFixed(2))}],function(v){var n=parse(v[0]);if(n===null||n<0)return"Digite um valor válido.";S.emp=n})};
render();
</script>
</body>
</html>
