name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Localizar Pasta Raiz do Projeto
        id: find-root
        run: |
          # Encontra a pasta que contém o settings.gradle
          # Isso lida com o fato de o projeto estar em uma subpasta (ex: violeta-bank-apk (1)/violeta-bank-apk)
          ROOT_DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n1)")
          echo "root_dir=$ROOT_DIR" >> $GITHUB_OUTPUT
          echo "O projeto raiz foi encontrado em: $ROOT_DIR"

      - name: Verificar Ícone
        run: |
          ROOT_DIR="${{ steps.find-root.outputs.root_dir }}"
          ICON_PATH="$ROOT_DIR/app/src/main/res/drawable/ic_launcher.png"
          
          if [ -f "$ICON_PATH" ]; then
            echo "✅ Ícone ic_launcher.png encontrado em: $ICON_PATH"
          else
            echo "❌ Erro: ic_launcher.png não encontrado no caminho esperado."
            echo "Verifique a estrutura: $ROOT_DIR/app/src/main/res/drawable/"
            ls -la "$ROOT_DIR/app/src/main/res/drawable/" || echo "Pasta drawable não existe."
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd "${{ steps.find-root.outputs.root_dir }}"
          # Usa o wrapper do projeto se existir, senão usa o gradle instalado
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nubank
          path: "**/build/outputs/apk/debug/*.apk"
