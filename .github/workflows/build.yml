name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Localizar Pasta Raiz do Projeto
        id: find-root
        run: |
          ROOT_DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n1)")
          echo "root_dir=$ROOT_DIR" >> $GITHUB_OUTPUT
          echo "O projeto raiz foi encontrado em: $ROOT_DIR"

      - name: Verificar e Corrigir Ícone
        run: |
          ROOT_DIR="${{ steps.find-root.outputs.root_dir }}"
          
          # Cria a pasta drawable padrão se não existir
          STANDARD_DRAWABLE="$ROOT_DIR/app/src/main/res/drawable"
          mkdir -p "$STANDARD_DRAWABLE"
          
          # Busca por ic_launcher.png em qualquer subpasta drawable do projeto
          ICON_FOUND=$(find "$ROOT_DIR" -name "ic_launcher.png" -type f | head -n1)
          
          if [ -n "$ICON_FOUND" ]; then
            echo "✅ Ícone encontrado em: $ICON_FOUND"
            
            # Se o ícone não estiver na pasta padrão, copia para lá
            if [ "$ICON_FOUND" != "$STANDARD_DRAWABLE/ic_launcher.png" ]; then
              echo "Copiando ícone para localização padrão..."
              cp "$ICON_FOUND" "$STANDARD_DRAWABLE/ic_launcher.png"
            fi
          else
            echo "❌ Nenhum ic_launcher.png encontrado no projeto"
            exit 1
          fi
          
          # Verifica se o AndroidManifest.xml referencia o ícone
          MANIFEST="$ROOT_DIR/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if grep -q 'android:icon' "$MANIFEST"; then
              echo "✅ AndroidManifest.xml já referencia o ícone"
            else
              echo "Adicionando referência ao ícone no AndroidManifest.xml..."
              sed -i 's|<application|<application android:icon="@drawable/ic_launcher"|' "$MANIFEST"
            fi
          else
            echo "⚠️ AndroidManifest.xml não encontrado em: $MANIFEST"
          fi

      - name: Alterar Nome do App para Nubank
        run: |
          ROOT_DIR="${{ steps.find-root.outputs.root_dir }}"
          
          # Procura por qualquer arquivo .xml que contenha "app_name"
          APP_NAME_FILES=$(grep -rl 'name="app_name"' "$ROOT_DIR" --include="*.xml" 2>/dev/null)
          
          if [ -n "$APP_NAME_FILES" ]; then
            echo "Arquivos contendo app_name encontrados:"
            echo "$APP_NAME_FILES"
            
            # Altera cada arquivo encontrado
            for FILE in $APP_NAME_FILES; do
              echo "Alterando app_name em: $FILE"
              # Substitui qualquer valor atual de app_name por Nubank
              sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">Nubank<\/string>/' "$FILE"
              
              # Verificação
              if grep -q '<string name="app_name">Nubank<\/string>' "$FILE"; then
                echo "✅ Nome do app alterado para Nubank em: $FILE"
              else
                echo "⚠️ Não foi possível alterar o app_name em: $FILE"
              fi
            done
          else
            echo "⚠️ Nenhum arquivo com app_name encontrado. Criando strings.xml padrão..."
            
            # Cria a pasta e arquivo se não existirem
            VALUES_DIR="$ROOT_DIR/app/src/main/res/values"
            mkdir -p "$VALUES_DIR"
            STRINGS_FILE="$VALUES_DIR/strings.xml"
            
            # Cria o arquivo com o conteúdo padrão
            cat > "$STRINGS_FILE" << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">Nubank</string>
</resources>
EOF
            echo "✅ strings.xml criado com app_name=Nubank em: $STRINGS_FILE"
          fi

      - name: Build debug APK
        run: |
          cd "${{ steps.find-root.outputs.root_dir }}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nubank
          path: "**/build/outputs/apk/debug/*.apk"
