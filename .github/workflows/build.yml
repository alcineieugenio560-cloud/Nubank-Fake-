name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Localizar Pasta Raiz do Projeto
        id: find-root
        run: |
          # Procura pelo settings.gradle. 
          # Como a estrutura mudou, isso agora deve apontar para ./violeta-bank-apk (1)
          ROOT_DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n1)")
          echo "root_dir=$ROOT_DIR" >> $GITHUB_OUTPUT
          echo "O projeto raiz foi encontrado em: $ROOT_DIR"

      - name: Verificar e Corrigir Ícone
        run: |
          ROOT_DIR="${{ steps.find-root.outputs.root_dir }}"
          
          # Garante que a pasta drawable padrão exista na NOVA estrutura
          # Ex: ./violeta-bank-apk (1)/app/src/main/res/drawable
          STANDARD_DRAWABLE="$ROOT_DIR/app/src/main/res/drawable"
          mkdir -p "$STANDARD_DRAWABLE"
          
          # Busca por ic_launcher.png em qualquer subpasta 'drawable' dentro da raiz do projeto
          # Isso lida com o caso de estar em ./violeta-bank-apk (1)/drawable ou ./violeta-bank-apk (1)/app/src/main/res/drawable
          ICON_FOUND=$(find "$ROOT_DIR" -type d -name "drawable*" -exec find {} -name "ic_launcher.png" -type f \; | head -n1)
          
          if [ -n "$ICON_FOUND" ]; then
            echo "✅ Ícone encontrado em: $ICON_FOUND"
            
            # Se o ícone não estiver na pasta drawable padrão, copia para lá
            if [ "$ICON_FOUND" != "$STANDARD_DRAWABLE/ic_launcher.png" ]; then
              echo "Copiando ícone para localização padrão: $STANDARD_DRAWABLE/ic_launcher.png"
              cp "$ICON_FOUND" "$STANDARD_DRAWABLE/ic_launcher.png"
            else
              echo "✅ Ícone já está na localização padrão."
            fi
          else
            echo "❌ Nenhum ic_launcher.png encontrado em pastas drawable dentro de: $ROOT_DIR"
            # Lista pastas drawable para debug
            echo "Pastas drawable encontradas:"
            find "$ROOT_DIR" -type d -name "drawable*"
            exit 1
          fi

      - name: Corrigir AndroidManifest (Nome e Ícone)
        run: |
          ROOT_DIR="${{ steps.find-root.outputs.root_dir }}"
          # O Manifest agora deve estar em ./violeta-bank-apk (1)/app/src/main/AndroidManifest.xml
          MANIFEST="$ROOT_DIR/app/src/main/AndroidManifest.xml"
          
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml não encontrado em: $MANIFEST"
            exit 1
          fi

          # 1. Corrigir o Nome (android:label)
          if grep -q 'android:label' "$MANIFEST"; then
            echo "Alterando android:label para Nubank..."
            sed -i 's#android:label="[^"]*"#android:label="Nubank"#' "$MANIFEST"
          else
            # Se não houver label, adiciona no <application>
            echo "Adicionando android:label='Nubank' ao <application>..."
            sed -i 's#<application#<application android:label="Nubank"#' "$MANIFEST"
          fi

          # 2. Corrigir o Ícone (android:icon)
          if grep -q 'android:icon' "$MANIFEST"; then
            echo "✅ android:icon já presente."
          else
            echo "Adicionando android:icon='@drawable/ic_launcher' ao <application>..."
            sed -i 's#<application#<application android:icon="@drawable/ic_launcher"#' "$MANIFEST"
          fi

          # Verificação final
          echo "Conteúdo atual da tag <application>:"
          grep -A 3 '<application' "$MANIFEST"

      - name: Build debug APK
        run: |
          cd "${{ steps.find-root.outputs.root_dir }}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nubank
          path: "**/build/outputs/apk/debug/*.apk"
